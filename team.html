        type="logo.png">

    <meta name="description" content="Explore AG’s team history, member profiles and organizational structure.">

  <link rel="modulepreload" crossorigin href="/AG-Home/assets/localization-BMu7Mjpi.js">

  <link rel="modulepreload" crossorigin href="/AG-Home/assets/notifications-BSgMVZUt.js">

  <link rel="modulepreload" crossorigin href="/AG-Home/assets/home-BPNNJpEp.js">

  <link rel="stylesheet" crossorigin href="/AG-Home/assets/styles_1-mbI_Pgk_.css">
</head>

<body class="about-page team-page" data-theme="light">
    <!-- Add Loader -->
    <div class="loader-container">
        <div class="logo-loader">
            <img src="/AG-Home/logo.png"
                alt="Logo">
            <div class="smoke-ring"></div>
            <div class="smoke-ring" style="animation-delay: 0.5s"></div>
            <div class="smoke-ring" style="animation-delay: 1s"></div>
        </div>
    </div>

    <div class="background-content">
        <header>
            <a class="brand" href="home.html"><img src="/AG-Home/logo.png" alt="">AG Home</a>
            <div class="header-titles">
                <h1 data-i18n="team.title">Our Team</h1>
            </div>
            <div class="header-controls">
                <button id="settingsBtn" class="settings-btn" type="button" title="Settings" data-i18n-aria="modal.settings" data-i18n-title="modal.settings" aria-label="Settings">
                    <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
                        <!-- simplified gear icon path to replace malformed d attribute -->
                        <path fill="currentColor"
                            d="M11.983 2.641a1 1 0 00-1.966 0l-.07.265a8.042 8.042 0 00-1.383.4l-.201-.201a1 1 0 10-1.414 1.414l.2.2a8.088 8.088 0 00-.399 1.38l-.265.07a1 1 0 000 1.966l.265.07c.099.456.248.9.439 1.314l-.2.2a1 1 0 101.414 1.414l.2-.2c.415.191.859.34 1.314.439l.07.265a1 1 0 001.966 0l.07-.265c.455-.099.9-.248 1.314-.439l.2.2a1 1 0 001.414-1.414l-.2-.2c.191-.415.34-.859.439-1.314l.265-.07a1 1 0 000-1.966l-.265-.07a8.042 8.042 0 00-.4-1.383l.201-.201a1 1 0 10-1.414-1.414l-.2.2a8.088 8.088 0 00-1.38-.399l-.07-.265zM10 13a3 3 0 110-6 3 3 0 010 6z" />
                    </svg>
                </button>
            </div>
        </header>
        <nav>
            <ul>
                <li><a href="home.html" data-i18n="nav.home">Home</a></li>
                <li><a href="about.html" data-i18n="nav.about">About Us</a></li>
                <li class="active"><a href="team.html" data-i18n="team.title">Our Team</a></li>
                <li><a href="products.html" data-i18n="nav.products">Products</a></li>
                <li><a href="privacy.html" data-i18n="nav.privacy">Privacy</a></li>
                <li><a href="contact.html" data-i18n="nav.contact">Contact Us</a></li>
            </ul>
        </nav>
        <main class="container organization-page">
            <div class="team-heading"><span class="team-eyebrow">AG HOME</span><h2 id="historyHeading" data-i18n="org.history">Team History</h2></div>
            <p id="teamDataStatus" role="status"></p>
            <section aria-labelledby="historyHeading">
                <div class="team-filters">
                    <label><span data-i18n="org.history">Team History</span><select id="teamStatus"><option value="all" data-i18n="org.history">Team History</option><option value="current" data-i18n="org.current">Current Team</option><option value="former" data-i18n="org.former">Former Team</option></select></label>
                    <label><span data-i18n="org.department">Department</span><select id="teamDepartment"></select></label>
                    <label><span data-i18n="org.year">Year</span><select id="teamYear"></select></label>
                    <label><span data-i18n="details.name">Name</span><input id="teamSearch" type="search" autocomplete="off"></label>
                </div>
                <div id="teamTimeline" class="team-timeline" aria-live="polite"></div>
            </section>
            <section class="organization-section" aria-labelledby="organizationHeading">
                <h2 id="organizationHeading" data-i18n="org.organization">Organization Structure</h2>
                <p id="teamCatalogueStatus" role="status"></p>
                <div id="organizationMap"></div>
                <aside id="teamProfile" class="team-profile" hidden aria-labelledby="teamProfileHeading"></aside>
            </section>
        </main>
        <!-- Shared Settings Modal -->
        <div id="settingsModal" class="modal hidden">
            <div class="modal-content">
                <form class="settings-form">
                    <div class="settings-section">
                        <h3 data-i18n="settings.theme">Theme Settings</h3>
                        <div class="theme-selector">
                            <button type="button" class="theme-btn" data-theme="light" data-i18n="settings.themeLight">Light</button>
                            <button type="button" class="theme-btn" data-theme="dark" data-i18n="settings.themeDark">Dark</button>
                        </div>
                    </div>
                    <div class="settings-section">
                        <h3 data-i18n="settings.language">Language</h3>
                        <div class="language-selector">
                            <button type="button" class="language-btn" data-language="en" title="English" data-i18n="settings.languageEn">🇺🇸 English</button>
                            <button type="button" class="language-btn" data-language="ur" title="Urdu" data-i18n="settings.languageUr">🇵🇰 اردو</button>
                        </div>
                    </div>
                    <div class="user-info-wrapper">
                        <div class="user-id-label" data-i18n="msg.userId">User ID</div>
                        <div id="userDisplay" class="user-display"></div>
                        <button id="logoutBtn" class="logout-btn" data-i18n="btn.logout">Logout</button>
                    </div>
                    <button type="button" id="closeSettings" class="close-btn" data-i18n="settings.close">Close Settings</button>
                </form>
            </div>
        </div>
    </div>
    <footer>
        <p></p>
    </footer>
</body>

</html>
